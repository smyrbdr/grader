name: Android uygulamasını derle

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Uygulama dosyalarını hazırla (www)
        run: node scripts/build-www.mjs

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Uygulama simgesini üret
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: İzinleri ekle (kamera, Android 9 ve öncesi için depolama)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' "$M"
          grep -q 'WRITE_EXTERNAL_STORAGE' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' "$M"
          cat "$M"

      - name: Sürüm numarası
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -E 'versionCode|versionName' "$G"

      - name: Web dosyalarını Android projesine kopyala
        run: npx cap sync android

      - name: Derle
        working-directory: android
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
                  -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                  -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                  -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            ./gradlew --no-daemon assembleRelease bundleRelease $SIGN
            cp app/build/outputs/apk/release/app-release.apk ../out/NotAsistani-1.0.${{ github.run_number }}.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/NotAsistani-1.0.${{ github.run_number }}.aab
          else
            echo "::warning::İmza anahtarı (KEYSTORE_BASE64) tanımlı değil; geçici debug APK üretiliyor. Bu APK sonraki sürümlerle güncellenemez."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/NotAsistani-1.0.${{ github.run_number }}-debug.apk
          fi
          ls -la ../out

      - name: Play Store paketi (AAB) - yalnızca size özel indirme
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: play-store-aab
          path: out/*.aab
          retention-days: 30

      - name: APK'yı Releases sayfasında yayınla
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Not Asistanı 1.0.${{ github.run_number }}
          files: out/*.apk
          body: |
            Android telefona kurmak için aşağıdaki .apk dosyasını telefondan indirip açın.
            İlk kurulumda "bilinmeyen kaynaklardan yüklemeye izin ver" onayı istenir.
